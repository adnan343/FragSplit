name: fragsplit
services:
  db:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_DB: fragsplit
      POSTGRES_USER: fragsplit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragsplit -d fragsplit"]
      interval: 3s
      timeout: 3s
      retries: 20
  db-roles:
    image: postgres:17
    depends_on:
      db: {condition: service_healthy}
    entrypoint: ["psql", "-X", "--single-transaction", "--set=ON_ERROR_STOP=1", "--file=/roles.sql"]
    environment:
      PGHOST: db
      PGDATABASE: fragsplit
      PGUSER: fragsplit
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SHOP_MIGRATION_PASSWORD: ${SHOP_MIGRATION_PASSWORD:?set SHOP_MIGRATION_PASSWORD}
      SHOP_RUNTIME_PASSWORD: ${SHOP_RUNTIME_PASSWORD:?set SHOP_RUNTIME_PASSWORD}
    volumes: [./db-roles.sql:/roles.sql:ro]
  migrate:
    image: ${COMPOSE_PROJECT_NAME}-api
    pull_policy: never
    command: ["migrate"]
    depends_on:
      db-roles: {condition: service_completed_successfully}
    environment:
      ConnectionStrings__Shop: "Host=db;Database=fragsplit;Username=vialmuse_migrator;Password=${SHOP_MIGRATION_PASSWORD}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      GRANT_RUNTIME_ACCESS: "true"
      KEY_DIRECTORY: /app/keys
    volumes: [keys:/app/keys]
  api:
    restart: unless-stopped
    image: ${COMPOSE_PROJECT_NAME}-api
    build: ../apps/api
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      ConnectionStrings__Shop: "Host=db;Database=fragsplit;Username=vialmuse_api;Password=${SHOP_RUNTIME_PASSWORD}"
      MIGRATE_ON_STARTUP: "false"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      INGRESS_SECRET: ${INGRESS_SECRET:?set INGRESS_SECRET}
      CATALOG_ORIGIN_SECRET: ${CATALOG_ORIGIN_SECRET:-}
      COD_HOLD_MINUTES: ${COD_HOLD_MINUTES:-1440}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KEY_DIRECTORY: /app/keys
    volumes: [uploads:/app/uploads, keys:/app/keys]
  web:
    restart: unless-stopped
    build: ../apps/web
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      CATALOG_ORIGIN_SECRET: ${CATALOG_ORIGIN_SECRET:-}
    depends_on: [api]
  ingress:
    restart: unless-stopped
    image: nginx:1.30.7-alpine
    environment:
      INGRESS_SECRET: ${INGRESS_SECRET:?set INGRESS_SECRET}
      HSTS_HOST: ${HSTS_HOST:-disabled.invalid}
      TRUSTED_TUNNEL_PROXY: ${TRUSTED_TUNNEL_PROXY:-unix:}
    volumes: [./ingress.conf.template:/etc/nginx/templates/default.conf.template:ro]
    ports: ["127.0.0.1:${STORE_PORT:-3000}:3000"]
    depends_on: [web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgdata:
  uploads:
  keys:
